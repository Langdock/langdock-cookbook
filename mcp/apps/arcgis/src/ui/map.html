<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArcGIS Map</title>
    <link
      rel="stylesheet"
      href="https://js.arcgis.com/4.32/esri/themes/light/main.css"
    />
    <style>
      :root {
        --bg: #ffffff;
        --fg: #09090b;
        --fg-muted: #71717a;
        --border: #e4e4e7;
        --accent: #2e7d32;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto,
          sans-serif;
        font-size: 14px;
        line-height: 1.5;
        background: var(--bg);
        color: var(--fg);
        display: flex;
        flex-direction: column;
      }
      .map-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        height: 100%;
      }
      #map {
        flex: 1;
        min-height: 280px;
      }
      .panel {
        border-top: 1px solid var(--border);
        padding: 12px 16px;
        max-height: 36%;
        overflow: auto;
      }
      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }
      .panel-header h2 {
        font-size: 14px;
        font-weight: 600;
      }
      .badge {
        font-size: 11px;
        font-weight: 500;
        background: var(--accent);
        color: white;
        padding: 2px 8px;
        border-radius: 10px;
      }
      .muted {
        color: var(--fg-muted);
        font-size: 12px;
      }
      .layer-row {
        padding: 6px 0;
        border-bottom: 1px solid var(--border);
        font-size: 13px;
      }
      .layer-row:last-child {
        border-bottom: none;
      }
      a {
        color: var(--accent);
      }
      .loading,
      .error {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 280px;
        color: var(--fg-muted);
        font-size: 13px;
        padding: 24px;
        text-align: center;
      }
      .error {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <div class="map-container">
      <div id="map">
        <div class="loading">Loading map…</div>
      </div>
      <div class="panel" id="panel"></div>
    </div>
    <script src="https://js.arcgis.com/4.32/"></script>
    <script>
      class App {
        constructor(options) {
          this.name = options.name;
          this.version = options.version;
          this.onrenderdata = null;
          this._queuedMessages = [];
        }
        connect() {
          window.addEventListener("message", (event) => {
            const message = event.data;
            let renderData = null;
            if (
              message?.method === "ui/notifications/tool-result" &&
              message.params?._meta?.["mcpui.dev/ui-initial-render-data"]
            ) {
              renderData =
                message.params._meta["mcpui.dev/ui-initial-render-data"];
            } else if (message?.type === "renderData" && message.data) {
              renderData = message.data;
            } else if (
              (message?.type === "init" || message?.type === "initialData") &&
              message.data
            ) {
              renderData = message.data;
            } else if (message?.webmap || message?.itemId) {
              renderData = message;
            } else if (message?.renderData) {
              renderData = message.renderData;
            }
            if (renderData) {
              if (this.onrenderdata) this.onrenderdata(renderData);
              else this._queuedMessages.push(renderData);
            }
          });
          window.parent.postMessage({ type: "appReady", name: this.name }, "*");
        }
        processQueue() {
          while (this._queuedMessages.length > 0 && this.onrenderdata) {
            this.onrenderdata(this._queuedMessages.shift());
          }
        }
      }

      const app = new App({ name: "ArcGIS Map", version: "1.0.0" });
      const mapEl = document.getElementById("map");
      const panelEl = document.getElementById("panel");
      let view = null;

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function getEmbeddedSchema() {
        if (window.MAP_DATA) return window.MAP_DATA;
        const container = document.querySelector(".map-container");
        const schemaAttr = container?.getAttribute("data-schema");
        if (!schemaAttr) return null;
        try {
          return JSON.parse(schemaAttr);
        } catch {
          return null;
        }
      }

      function renderPanel(data) {
        const layers = data.webmap?.operationalLayers || [];
        const viewer = data.viewerUrl
          ? `<a href="${escapeHtml(data.viewerUrl)}" target="_blank" rel="noopener">Open in Map Viewer</a>`
          : '<span class="muted">Not saved yet — ask to save the web map</span>';
        panelEl.innerHTML = `
          <div class="panel-header">
            <h2>${escapeHtml(data.title || "Untitled map")}</h2>
            <span class="badge">${layers.length} layer${layers.length === 1 ? "" : "s"}</span>
          </div>
          <p class="muted">${escapeHtml(data.webmap?.baseMap?.title || "Streets")} · ${viewer}</p>
          ${layers
            .map(
              (layer) =>
                `<div class="layer-row">${escapeHtml(layer.title)}<div class="muted">${escapeHtml(layer.id)}</div></div>`,
            )
            .join("")}
        `;
      }

      function renderMap(data) {
        if (!data?.webmap && !data?.itemId) {
          mapEl.innerHTML =
            '<div class="error">No map yet. Create a map or open a web map item.</div>';
          return;
        }
        renderPanel(data);
        window.require(
          [
            "esri/WebMap",
            "esri/views/MapView",
            "esri/identity/IdentityManager",
            "esri/config",
          ],
          (WebMap, MapView, IdentityManager, esriConfig) => {
            if (data.portalUrl) {
              esriConfig.portalUrl = data.portalUrl;
            }
            if (data.token && data.portalUrl) {
              IdentityManager.registerToken({
                server: String(data.portalUrl).replace(/\/$/, "") + "/sharing/rest",
                token: data.token,
              });
            }
            if (view) {
              view.destroy();
              view = null;
            }
            mapEl.innerHTML = "";
            // Always render the tool snapshot so add_layer after save is not stale.
            const webmap = data.webmap
              ? WebMap.fromJSON(data.webmap)
              : new WebMap({ portalItem: { id: data.itemId } });
            view = new MapView({
              container: mapEl,
              map: webmap,
            });
            const geom = data.webmap?.initialState?.viewpoint?.targetGeometry;
            if (geom && geom.xmin != null) {
              view.when(() =>
                view.goTo({
                  target: {
                    xmin: geom.xmin,
                    ymin: geom.ymin,
                    xmax: geom.xmax,
                    ymax: geom.ymax,
                    spatialReference: geom.spatialReference || { wkid: 4326 },
                  },
                }),
              );
            }
          },
          (err) => {
            mapEl.innerHTML =
              '<div class="error">Could not load the ArcGIS map SDK.</div>';
            console.error(err);
          },
        );
      }

      app.onrenderdata = renderMap;
      app.connect();
      app.processQueue();
      const embedded = getEmbeddedSchema();
      if (embedded) renderMap(embedded);
    </script>
  </body>
</html>
