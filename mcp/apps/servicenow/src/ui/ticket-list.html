<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ServiceNow Tickets</title>
    <style>
      :root { --fg: #18181b; --muted: #71717a; --border: #e4e4e7; --surface: #fafafa; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 20px; color: var(--fg); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .container { max-width: 760px; margin: 0 auto; }
      h1 { margin: 0; font-size: 18px; }
      .summary { color: var(--muted); margin: 4px 0 16px; }
      .ticket { width: 100%; text-align: left; display: block; padding: 14px; margin: 0 0 10px; border: 1px solid var(--border); border-radius: 8px; background: #fff; color: inherit; cursor: pointer; font: inherit; text-decoration: none; }
      .ticket:hover, .ticket:focus-visible { border-color: #a1a1aa; outline: none; }
      .top, .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
      .number { font-weight: 650; }
      .open-label { margin-left: auto; color: var(--muted); font-size: 12px; }
      .type, .state, .tag { padding: 2px 7px; border: 1px solid var(--border); border-radius: 999px; color: #3f3f46; font-size: 12px; background: var(--surface); }
      .description { margin: 6px 0; font-size: 15px; font-weight: 500; }
      .meta { color: var(--muted); font-size: 12px; }
      .empty { color: var(--muted); border: 1px dashed var(--border); border-radius: 8px; padding: 24px; text-align: center; }
      .error { color: #b91c1c; margin-top: 10px; }
    </style>
  </head>
  <body>
    <div class="ticket-list-container">
      <div class="container" id="content">Loading tickets…</div>
    </div>
    <script type="module">
      const content = document.getElementById("content");
      let messageId = 0;
      const pendingRequests = new Map();

      function requestHost(method, params) {
        const id = ++messageId;
        return new Promise((resolve, reject) => {
          pendingRequests.set(id, { resolve, reject });
          window.parent.postMessage(
            { jsonrpc: "2.0", id, method, params },
            "*",
          );
        });
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      function dataFromPage() {
        if (window.TICKET_LIST_DATA) return window.TICKET_LIST_DATA;
        const data = document.querySelector(".ticket-list-container")?.dataset.tickets;
        try { return data ? JSON.parse(data) : null; } catch { return null; }
      }

      function render(data) {
        const tickets = data?.tickets || [];
        const title = data?.title || "ServiceNow tickets";
        if (!tickets.length) {
          content.innerHTML = `<h1>${escapeHtml(title)}</h1><p class="summary">No tickets matched these filters.</p><div class="empty">Try broadening the state, assignment, or date filters.</div>`;
          return;
        }
        content.innerHTML = `<h1>${escapeHtml(title)}</h1><p class="summary">${tickets.length} matching ticket${tickets.length === 1 ? "" : "s"} — select one to open it in ServiceNow.</p>${tickets.map((ticket) => {
          const tags = [ticket.priority && `Priority ${ticket.priority}`, ticket.impact && `Impact ${ticket.impact}`, ticket.urgency && `Urgency ${ticket.urgency}`, ticket.severity && `Severity ${ticket.severity}`].filter(Boolean);
          const meta = [ticket.assignedTo && `Assigned to ${ticket.assignedTo}`, ticket.assignmentGroup && ticket.assignmentGroup, ticket.openedAt && `Opened ${ticket.openedAt}`, ticket.closedAt && `Closed ${ticket.closedAt}`].filter(Boolean);
          return `<a class="ticket" href="${escapeHtml(ticket.recordUrl)}" target="_blank" rel="noopener"><div class="top"><span class="number">${escapeHtml(ticket.number || "Ticket")}</span><span class="type">${escapeHtml(ticket.tableLabel || ticket.table)}</span>${ticket.state ? `<span class="state">${escapeHtml(ticket.state)}</span>` : ""}<span class="open-label">Open ↗</span></div><div class="description">${escapeHtml(ticket.shortDescription || "No short description")}</div><div class="meta">${tags.map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}${meta.map(escapeHtml).join(" · ")}</div></a>`;
        }).join("")}<div id="error" class="error" role="alert"></div>`;
        content.querySelectorAll(".ticket").forEach((link) =>
          link.addEventListener("click", async (event) => {
            event.preventDefault();
            const url = link.href;
            const errorEl = document.getElementById("error");
            try {
              const result = await requestHost("ui/open-link", { url });
              if (result?.isError) {
                throw new Error("The host denied the link request");
              }
            } catch (error) {
              errorEl.textContent = `${error.message || "Could not open ServiceNow."} URL: ${url}`;
            }
          }),
        );
      }

      window.addEventListener("message", (event) => {
        const message = event.data || {};
        const data = message.params?._meta?.["mcpui.dev/ui-initial-render-data"] || message.data || message.renderData;
        if (data?.tickets) render(data);
        if (message.id && pendingRequests.has(message.id)) {
          const request = pendingRequests.get(message.id);
          pendingRequests.delete(message.id);
          if (message.error) {
            request.reject(new Error(message.error.message || "Host request failed"));
          } else {
            request.resolve(message.result);
          }
        }
      });
      const embedded = dataFromPage();
      if (embedded) render(embedded);
      window.parent.postMessage({ type: "appReady", name: "ServiceNow Ticket Discovery" }, "*");
    </script>
  </body>
</html>
