<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Intranet</title>
    <style>
      :root {
        --text: #1f2026;
        --muted: #727376;
        --line: #e8e7e4;
        --well: #f5f4f2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #fbfaf9;
          --muted: #a1a1a3;
          --line: #37383d;
          --well: #2b2c32;
          background: #1f2026;
        }
        body {
          background: #1f2026;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--text);
        background: #fbfaf9;
        font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        height: 56px;
        padding: 0 28px;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      main {
        max-width: 640px;
        margin: 56px auto;
        padding: 0 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0;
        color: var(--muted);
        max-width: 42ch;
      }
    </style>
  </head>
  <body>
    <header>Intranet</header>
    <main>
      <h1>Welcome back</h1>
      <p>Use the assistant in the corner when you need a hand.</p>
    </main>
    <script src="/widget.js"></script>
  </body>
</html>
